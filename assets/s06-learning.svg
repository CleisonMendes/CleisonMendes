<svg width="100%" viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .bg { fill: #040d1a; }
    .card { fill: #071220; }
    .aurora1 { fill: #0a4a3a; opacity: 0.4; }
    .aurora2 { fill: #0d6e52; opacity: 0.25; }
    .star { fill: #c8eeff; }
    .title { font-family: 'Courier New', monospace; font-size: 16px; font-weight: 700; fill: #7df9ff; letter-spacing: 3px; }
    .item { font-family: 'Courier New', monospace; font-size: 11px; fill: #e8f9ff; }
    .card-border { stroke: #0d6e52; stroke-width: 0.8; fill: none; }
    .line { stroke: #7df9ff; stroke-width: 0.4; opacity: 0.4; }
    .border-text { font-family: 'Courier New', monospace; font-size: 9px; fill: #5ecfa0; letter-spacing: 2px; }
    .caption { font-family: 'Courier New', monospace; font-size: 9px; fill: #7da8b8; font-style: italic; }
  </style>
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="760" height="260" class="bg"/>

  <path d="M0 0 Q100 22 200 10 Q300 0 400 16 Q500 30 600 12 Q680 2 760 14 L760 44 L0 44 Z" class="aurora1"/>
  <path d="M0 0 Q120 16 240 7 Q360 0 480 14 Q600 26 760 9 L760 34 L0 34 Z" class="aurora2"/>

  <circle cx="70" cy="12" r="0.7" class="star" opacity="0.8"/>
  <circle cx="260" cy="6" r="0.6" class="star" opacity="0.7"/>
  <circle cx="460" cy="11" r="0.8" class="star" opacity="0.85"/>
  <circle cx="660" cy="7" r="0.7" class="star" opacity="0.9"/>

  <line x1="40" y1="43" x2="720" y2="43" class="line"/>
  <text x="380" y="66" text-anchor="middle" class="title" filter="url(#glow)">06 // CURRENTLY_LEARNING</text>

  <!-- Learning card -->
  <rect x="180" y="78" width="400" height="148" rx="6" class="card"/>
  <rect x="180" y="78" width="400" height="148" rx="6" class="card-border"/>

  <!-- Header bar -->
  <rect x="180" y="78" width="400" height="20" rx="6" fill="#0a1e30"/>
  <text x="380" y="92" text-anchor="middle" class="border-text">LEARNING PROTOCOL</text>

  <!-- Items col 1 -->
  <text x="220" y="116" class="item">🎓  Análise e Des. de Sistemas</text>
  <text x="220" y="134" class="item">🐍  Python</text>
  <text x="220" y="150" class="item">☕  Java</text>
  <text x="220" y="166" class="item">🗄️   SQL</text>

  <!-- Items col 2 -->
  <text x="440" y="116" class="item">🤖  Inteligência Artificial</text>
  <text x="440" y="134" class="item">📊  Dados e Machine Learning</text>
  <text x="440" y="150" class="item">⚙️   Automação</text>
  <text x="440" y="166" class="item">🌐  Desenvolvimento Web</text>

  <!-- Caption -->
  <text x="380" y="210" text-anchor="middle" class="caption">Transformando conhecimento acadêmico e experiência profissional em projetos práticos.</text>

  <line x1="40" y1="228" x2="720" y2="228" class="line"/>
  <path d="M0 231 Q150 221 300 234 Q450 244 600 231 Q700 222 760 232 L760 260 L0 260 Z" class="aurora1"/>
  <path d="M0 238 Q180 228 360 240 Q540 250 760 236 L760 260 L0 260 Z" class="aurora2"/>
</svg>
