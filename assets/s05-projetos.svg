<svg width="100%" viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .bg { fill: #040d1a; }
    .card { fill: #071220; }
    .aurora1 { fill: #0a4a3a; opacity: 0.4; }
    .aurora2 { fill: #0d6e52; opacity: 0.25; }
    .star { fill: #c8eeff; }
    .title { font-family: 'Courier New', monospace; font-size: 16px; font-weight: 700; fill: #7df9ff; letter-spacing: 3px; }
    .proj { font-family: 'Courier New', monospace; font-size: 11px; font-weight: 700; fill: #e8f9ff; }
    .desc { font-family: 'Courier New', monospace; font-size: 8.5px; fill: #7da8b8; }
    .stack { font-family: 'Courier New', monospace; font-size: 8px; fill: #5ecfa0; }
    .status-dev { font-family: 'Courier New', monospace; font-size: 8px; fill: #febc2e; }
    .status-study { font-family: 'Courier New', monospace; font-size: 8px; fill: #7df9ff; }
    .status-exp { font-family: 'Courier New', monospace; font-size: 8px; fill: #b07dff; }
    .card-border { stroke: #0d6e52; stroke-width: 0.8; fill: none; }
    .line { stroke: #7df9ff; stroke-width: 0.4; opacity: 0.4; }
  </style>
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="760" height="260" class="bg"/>

  <path d="M0 0 Q100 22 200 10 Q300 0 400 16 Q500 30 600 12 Q680 2 760 14 L760 44 L0 44 Z" class="aurora1"/>
