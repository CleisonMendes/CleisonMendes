  <text x="150" y="143" text-anchor="middle" class="desc">agenda e ranking</text>
  <text x="150" y="162" text-anchor="middle" class="stack">Python · SQL</text>
  <text x="150" y="198" text-anchor="middle" class="status-dev">🚧 Em desenvolvimento</text>

  <!-- Card 2: Sistema Aquicola -->
  <rect x="280" y="78" width="200" height="130" rx="6" class="card"/>
  <rect x="280" y="78" width="200" height="130" rx="6" class="card-border"/>
  <text x="380" y="100" text-anchor="middle" class="proj">🐟 Sist. Aquícola</text>
