  <circle cx="500" cy="11" r="0.8" class="star" opacity="0.85"/>
  <circle cx="680" cy="6" r="0.6" class="star" opacity="0.7"/>

  <line x1="40" y1="43" x2="720" y2="43" class="line"/>
  <text x="380" y="66" text-anchor="middle" class="title" filter="url(#glow)">05 // PROJETOS</text>

