<svg width="100%" viewBox="0 0 760 280" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .bg { fill: #040d1a; }
    .aurora1 { fill: #0a4a3a; opacity: 0.4; }
    .aurora2 { fill: #0d6e52; opacity: 0.25; }
    .star { fill: #c8eeff; }
    .title { font-family: 'Courier New', monospace; font-size: 16px; font-weight: 700; fill: #7df9ff; letter-spacing: 3px; }
    .node-biz { font-family: 'Courier New', monospace; font-size: 10px; fill: #febc2e; }
    .node-tech { font-family: 'Courier New', monospace; font-size: 10px; fill: #7df9ff; }
    .node-sol { font-family: 'Courier New', monospace; font-size: 10px; fill: #5ecfa0; }
    .item { font-family: 'Courier New', monospace; font-size: 9px; fill: #b0d8e8; }
    .arrow { stroke: #5ecfa0; stroke-width: 1; fill: none; opacity: 0.7; }
    .arrow-head { fill: #5ecfa0; opacity: 0.7; }
    .line { stroke: #7df9ff; stroke-width: 0.4; opacity: 0.4; }
    .desc { font-family: 'Courier New', monospace; font-size: 9.5px; fill: #b0d8e8; }
    .box { fill: #071220; }
    .box-border { stroke: #0d6e52; stroke-width: 0.8; fill: none; }
  </style>
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="760" height="280" class="bg"/>

  <path d="M0 0 Q100 22 200 10 Q300 0 400 16 Q500 30 600 12 Q680 2 760 14 L760 44 L0 44 Z" class="aurora1"/>
  <path d="M0 0 Q120 16 240 7 Q360 0 480 14 Q600 26 760 9 L760 34 L0 34 Z" class="aurora2"/>

  <circle cx="90" cy="13" r="0.7" class="star" opacity="0.8"/>
  <circle cx="310" cy="7" r="0.6" class="star" opacity="0.7"/>
  <circle cx="530" cy="11" r="0.8" class="star" opacity="0.85"/>
  <circle cx="700" cy="6" r="0.7" class="star" opacity="0.9"/>

  <line x1="40" y1="43" x2="720" y2="43" class="line"/>
  <text x="380" y="66" text-anchor="middle" class="title" filter="url(#glow)">07 // PROFESSIONAL_BACKGROUND</text>

  <!-- Description -->
  <text x="380" y="88" text-anchor="middle" class="desc">Trajetória ligada a meios de pagamento, BackOffice, Chargeback, contestação e prevenção a fraudes.</text>
  <text x="380" y="102" text-anchor="middle" class="desc">Visão de negócio combinada com programação, automação, dados e inteligência artificial.</text>

  <!-- NEGÓCIO box -->
  <rect x="80" y="116" width="170" height="108" rx="6" class="box"/>
  <rect x="80" y="116" width="170" height="108" rx="6" class="box-border"/>
  <text x="165" y="134" text-anchor="middle" class="node-biz">NEGÓCIO</text>
  <line x1="100" y1="138" x2="232" y2="138" stroke="#febc2e" stroke-width="0.5" opacity="0.4"/>
  <text x="100" y="154" class="item">├── Meios de pagamento</text>
  <text x="100" y="168" class="item">├── Chargeback</text>
  <text x="100" y="182" class="item">├── Contestação</text>
  <text x="100" y="196" class="item">└── Prevenção a fraudes</text>

  <!-- Arrow 1 -->
  <line x1="295" y1="170" x2="330" y2="170" class="arrow"/>
  <polygon points="330,166 338,170 330,174" class="arrow-head"/>

  <!-- TECNOLOGIA box -->
  <rect x="295" y="116" width="170" height="108" rx="6" class="box"/>
  <rect x="295" y="116" width="170" height="108" rx="6" class="box-border"/>
  <text x="380" y="134" text-anchor="middle" class="node-tech">TECNOLOGIA</text>
  <line x1="315" y1="138" x2="447" y2="138" stroke="#7df9ff" stroke-width="0.5" opacity="0.4"/>
  <text x="315" y="154" class="item">├── Python · SQL · Java</text>
  <text x="315" y="168" class="item">├── Automação</text>
  <text x="315" y="182" class="item">├── Dados</text>
  <text x="315" y="196" class="item">└── IA</text>

  <!-- Arrow 2 -->
  <line x1="510" y1="170" x2="545" y2="170" class="arrow"/>
  <polygon points="545,166 553,170 545,174" class="arrow-head"/>

  <!-- SOLUÇÕES box -->
  <rect x="510" y="116" width="170" height="108" rx="6" class="box"/>
  <rect x="510" y="116" width="170" height="108" rx="6" class="box-border"/>
  <text x="595" y="134" text-anchor="middle" class="node-sol">SOLUÇÕES</text>
  <line x1="530" y1="138" x2="662" y2="138" stroke="#5ecfa0" stroke-width="0.5" opacity="0.4"/>
  <text x="530" y="160" class="item">Projetos que unem</text>
  <text x="530" y="174" class="item">experiência de negócio</text>
  <text x="530" y="188" class="item">com tecnologia para</text>
  <text x="530" y="202" class="item">gerar valor real.</text>

  <line x1="40" y1="244" x2="720" y2="244" class="line"/>
  <path d="M0 247 Q150 237 300 250 Q450 260 600 247 Q700 238 760 248 L760 280 L0 280 Z" class="aurora1"/>
  <path d="M0 254 Q180 244 360 256 Q540 266 760 252 L760 280 L0 280 Z" class="aurora2"/>
</svg>
