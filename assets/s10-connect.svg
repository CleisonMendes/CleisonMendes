<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="215" viewBox="0 0 1000 215">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#040d1a"/>
    <stop offset="1" stop-color="#0B2037"/>
  </linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7DF9FF" stop-opacity=".08"/>
    <stop offset=".55" stop-color="#7DF9FF" stop-opacity=".02"/>
    <stop offset="1" stop-color="#A78BFA" stop-opacity=".08"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#7DF9FF" stroke-opacity=".055" stroke-width="1"/>
  </pattern>
  <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
<rect width="1000" height="215" rx="18" fill="url(#bg)"/>
<rect width="1000" height="215" rx="18" fill="url(#grid)"/>
<rect width="1000" height="215" rx="18" fill="url(#glow)"/>
<circle cx="900" cy="30" r="90" fill="#7DF9FF" opacity=".07" filter="url(#soft)"/>
<path d="M24 18H976" stroke="#18334D" stroke-width="1"/>

