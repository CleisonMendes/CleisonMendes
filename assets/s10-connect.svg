<svg width="100%" viewBox="0 0 760 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .bg { fill: #040d1a; }
    .aurora1 { fill: #0a4a3a; opacity: 0.5; }
    .aurora2 { fill: #0d6e52; opacity: 0.32; }
    .aurora3 { fill: #0b3d5c; opacity: 0.4; }
    .star { fill: #c8eeff; }
    .title { font-family: 'Courier New', monospace; font-size: 16px; font-weight: 700; fill: #7df9ff; letter-spacing: 3px; }
    .btn-bg { fill: #071220; }
    .btn-border { stroke: #0d6e52; stroke-width: 1; fill: none; }
    .btn-text { font-family: 'Courier New', monospace; font-size: 11px; fill: #7df9ff; letter-spacing: 1px; }
    .line { stroke: #7df9ff; stroke-width: 0.4; opacity: 0.4; }
    .footer-name { font-family: 'Courier New', monospace; font-size: 18px; font-weight: 700; fill: #e8f9ff; letter-spacing: 4px; }
    .footer-sub { font-family: 'Courier New', monospace; font-size: 9px; fill: #5ecfa0; letter-spacing: 3px; }
    .footer-quote { font-family: 'Courier New', monospace; font-size: 9px; fill: #7da8b8; font-style: italic; }
  </style>
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="760" height="220" class="bg"/>

  <!-- Aurora waves top -->
  <path d="M0 0 Q100 22 200 10 Q300 0 400 16 Q500 30 600 12 Q680 2 760 14 L760 44 L0 44 Z" class="aurora1"/>
  <path d="M0 0 Q120 16 240 7 Q360 0 480 14 Q600 26 760 9 L760 34 L0 34 Z" class="aurora2"/>

  <circle cx="60" cy="12" r="0.7" class="star" opacity="0.9"/>
  <circle cx="230" cy="6" r="0.6" class="star" opacity="0.7"/>
  <circle cx="420" cy="10" r="0.8" class="star" opacity="0.85"/>
  <circle cx="610" cy="5" r="0.6" class="star" opacity="0.7"/>
  <circle cx="730" cy="11" r="0.7" class="star" opacity="0.9"/>

  <line x1="40" y1="43" x2="720" y2="43" class="line"/>
  <text x="380" y="66" text-anchor="middle" class="title" filter="url(#glow)">10 // CONNECT</text>

  <!-- LinkedIn button -->
  <rect x="230" y="78" width="130" height="34" rx="6" class="btn-bg"/>
  <rect x="230" y="78" width="130" height="34" rx="6" class="btn-border"/>
  <text x="295" y="100" text-anchor="middle" class="btn-text">🔗 LinkedIn</text>

  <!-- GitHub button -->
  <rect x="400" y="78" width="130" height="34" rx="6" class="btn-bg"/>
  <rect x="400" y="78" width="130" height="34" rx="6" class="btn-border"/>
  <text x="465" y="100" text-anchor="middle" class="btn-text">🐙 GitHub</text>

  <!-- Divider -->
  <line x1="200" y1="128" x2="560" y2="128" class="line"/>

  <!-- Footer -->
  <text x="380" y="152" text-anchor="middle" class="footer-name" filter="url(#glow)">🌌 CLEISON MENDES</text>
  <text x="380" y="168" text-anchor="middle" class="footer-sub">BUILD · AUTOMATE · LEARN · EVOLVE</text>
  <text x="380" y="184" text-anchor="middle" class="footer-quote">✨ Construindo hoje a tecnologia do amanhã.</text>

  <!-- Aurora waves bottom -->
  <path d="M0 192 Q100 182 200 194 Q300 204 400 192 Q500 180 600 194 Q700 205 760 192 L760 220 L0 220 Z" class="aurora1"/>
  <path d="M0 200 Q150 190 300 202 Q450 212 600 200 Q700 192 760 200 L760 220 L0 220 Z" class="aurora2"/>
  <path d="M0 208 Q200 198 400 210 Q600 220 760 206 L760 220 L0 220 Z" class="aurora3"/>

  <!-- Stars bottom -->
  <circle cx="100" cy="210" r="0.6" class="star" opacity="0.6"/>
  <circle cx="380" cy="205" r="0.7" class="star" opacity="0.7"/>
  <circle cx="660" cy="212" r="0.6" class="star" opacity="0.6"/>
</svg>
