<svg width="100%" viewBox="0 0 760 180" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .bg { fill: #040d1a; }
    .aurora1 { fill: #0a4a3a; opacity: 0.4; }
    .aurora2 { fill: #0d6e52; opacity: 0.25; }
    .star { fill: #c8eeff; }
    .title { font-family: 'Courier New', monospace; font-size: 16px; font-weight: 700; fill: #7df9ff; letter-spacing: 3px; }
    .label { font-family: 'Courier New', monospace; font-size: 9px; fill: #5ecfa0; letter-spacing: 1px; }
    .note { font-family: 'Courier New', monospace; font-size: 8.5px; fill: #7da8b8; font-style: italic; }
    .line { stroke: #7df9ff; stroke-width: 0.4; opacity: 0.4; }
    .placeholder { fill: #071220; }
    .placeholder-border { stroke: #0d6e52; stroke-width: 0.8; fill: none; }
    .ph-text { font-family: 'Courier New', monospace; font-size: 9px; fill: #3fbf88; opacity: 0.7; }
  </style>
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="760" height="180" class="bg"/>

  <path d="M0 0 Q100 18 200 8 Q300 0 400 14 Q500 26 600 10 Q680 2 760 12 L760 36 L0 36 Z" class="aurora1"/>
  <path d="M0 0 Q120 13 240 6 Q360 0 480 12 Q600 22 760 8 L760 28 L0 28 Z" class="aurora2"/>

  <circle cx="100" cy="10" r="0.7" class="star" opacity="0.8"/>
  <circle cx="350" cy="5" r="0.6" class="star" opacity="0.7"/>
  <circle cx="600" cy="9" r="0.7" class="star" opacity="0.85"/>

  <line x1="40" y1="35" x2="720" y2="35" class="line"/>
  <text x="380" y="57" text-anchor="middle" class="title" filter="url(#glow)">08 // GITHUB_METRICS  +  09 // CONTRIBUTION_MATRIX</text>

  <!-- Stats placeholder left -->
  <rect x="60" y="66" width="290" height="68" rx="4" class="placeholder"/>
  <rect x="60" y="66" width="290" height="68" rx="4" class="placeholder-border"/>
  <text x="205" y="96" text-anchor="middle" class="ph-text">[ GitHub Stats ]</text>
  <text x="205" y="114" text-anchor="middle" class="ph-text">github-readme-stats · CleisonMendes</text>

  <!-- Stats placeholder right -->
  <rect x="370" y="66" width="180" height="68" rx="4" class="placeholder"/>
  <rect x="370" y="66" width="180" height="68" rx="4" class="placeholder-border"/>
  <text x="460" y="96" text-anchor="middle" class="ph-text">[ Top Langs ]</text>
  <text x="460" y="114" text-anchor="middle" class="ph-text">CleisonMendes</text>

  <!-- Streak placeholder -->
  <rect x="570" y="66" width="152" height="68" rx="4" class="placeholder"/>
  <rect x="570" y="66" width="152" height="68" rx="4" class="placeholder-border"/>
  <text x="646" y="96" text-anchor="middle" class="ph-text">[ Streak ]</text>
  <text x="646" y="114" text-anchor="middle" class="ph-text">streak-stats</text>

  <text x="380" y="154" text-anchor="middle" class="note">ℹ️  As estatísticas são geradas por serviços externos e ficam visíveis após atividade pública no GitHub.</text>

  <line x1="40" y1="162" x2="720" y2="162" class="line"/>
  <path d="M0 165 Q150 155 300 168 Q450 178 600 165 Q700 156 760 166 L760 180 L0 180 Z" class="aurora1"/>
</svg>
