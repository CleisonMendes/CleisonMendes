  <circle cx="430" cy="12" r="0.8" class="star" opacity="0.8"/>
  <circle cx="650" cy="6" r="0.7" class="star" opacity="0.85"/>

  <line x1="40" y1="43" x2="720" y2="43" class="line"/>

