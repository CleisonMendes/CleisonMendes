    .dataset { font-family: 'Courier New', monospace; font-size: 9px; fill: #7df9ff; opacity: 0.7; }
    .line { stroke: #7df9ff; stroke-width: 0.4; opacity: 0.4; }
    .card-border { stroke: #0d6e52; stroke-width: 0.8; fill: none; }
    .quote { font-family: 'Courier New', monospace; font-size: 9px; fill: #3fbf88; font-style: italic; }
  </style>
  <defs>
