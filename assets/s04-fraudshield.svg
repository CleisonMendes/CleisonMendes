    .star { fill: #c8eeff; }
    .title { font-family: 'Courier New', monospace; font-size: 16px; font-weight: 700; fill: #7df9ff; letter-spacing: 3px; }
    .proj-name { font-family: 'Courier New', monospace; font-size: 18px; font-weight: 700; fill: #e8f9ff; letter-spacing: 2px; }
    .proj-sub { font-family: 'Courier New', monospace; font-size: 10px; fill: #7df9ff; letter-spacing: 1px; }
    .desc { font-family: 'Courier New', monospace; font-size: 9.5px; fill: #b0d8e8; }
