<svg width="100%" viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .bg { fill: #040d1a; }
    .aurora1 { fill: #0a4a3a; opacity: 0.4; }
    .aurora2 { fill: #0d6e52; opacity: 0.25; }
    .star { fill: #c8eeff; }
    .title { font-family: 'Courier New', monospace; font-size: 16px; font-weight: 700; fill: #7df9ff; letter-spacing: 3px; }
    .key { font-family: 'Courier New', monospace; font-size: 11px; fill: #5ecfa0; }
    .val { font-family: 'Courier New', monospace; font-size: 11px; fill: #e8f9ff; }
    .bracket { font-family: 'Courier New', monospace; font-size: 11px; fill: #7df9ff; }
    .label { font-family: 'Courier New', monospace; font-size: 10px; fill: #7df9ff; letter-spacing: 2px; opacity: 0.6; }
    .line { stroke: #7df9ff; stroke-width: 0.4; opacity: 0.4; }
    .quote { font-family: 'Courier New', monospace; font-size: 10px; fill: #3fbf88; font-style: italic; }
    .aurora-title { font-family: 'Courier New', monospace; font-size: 12px; fill: #7df9ff; letter-spacing: 2px; }
  </style>
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="760" height="320" class="bg"/>

  <!-- Aurora waves top -->
  <path d="M0 0 Q100 30 200 15 Q300 0 400 20 Q500 38 600 18 Q680 4 760 18 L760 60 L0 60 Z" class="aurora1"/>
  <path d="M0 0 Q120 22 240 10 Q360 0 480 18 Q600 34 760 12 L760 45 L0 45 Z" class="aurora2"/>

  <!-- Stars -->
  <circle cx="40" cy="18" r="0.8" class="star" opacity="0.9"/>
  <circle cx="150" cy="8" r="0.6" class="star" opacity="0.7"/>
  <circle cx="300" cy="14" r="0.7" class="star" opacity="0.8"/>
  <circle cx="480" cy="6" r="0.8" class="star" opacity="0.85"/>
  <circle cx="620" cy="16" r="0.6" class="star" opacity="0.7"/>
  <circle cx="720" cy="9" r="0.7" class="star" opacity="0.9"/>

  <!-- Top divider -->
  <line x1="40" y1="55" x2="720" y2="55" class="line"/>

  <!-- Title -->
  <text x="380" y="80" text-anchor="middle" class="title" filter="url(#glow)">01 // IDENTIDADE</text>

  <!-- Code block left side -->
  <text x="80" y="108" class="bracket">cleison = {</text>
  <text x="100" y="126" class="key">"nome"</text><text x="180" y="126" class="val">: "Cleison Mendes",</text>
  <text x="100" y="142" class="key">"area_atual"</text><text x="220" y="142" class="val">: "BackOffice | Chargeback | Prevenção a Fraudes",</text>
  <text x="100" y="158" class="key">"formacao"</text><text x="210" y="158" class="val">: "Análise e Desenvolvimento de Sistemas",</text>
  <text x="100" y="174" class="key">"foco"</text><text x="175" y="174" class="val">: [</text>
  <text x="120" y="190" class="val">"Desenvolvimento", "Automação", "Inteligência Artificial",</text>
  <text x="120" y="206" class="val">"Dados", "Prevenção a Fraudes"</text>
  <text x="100" y="222" class="val">],</text>
  <text x="100" y="238" class="key">"linguagens"</text><text x="225" y="238" class="val">: ["Python", "Java", "SQL"],</text>
  <text x="100" y="254" class="key">"mentalidade"</text><text x="235" y="254" class="val">: "Codificar. Automatizar. Evoluir."</text>
  <text x="80" y="270" class="bracket">}</text>

  <!-- Aurora label -->
  <text x="380" y="292" text-anchor="middle" class="aurora-title">🌌  AURORA TECH  //  "Uma pequena luz hoje pode iluminar grandes caminhos amanhã ✨"</text>

  <!-- Bottom divider -->
  <line x1="40" y1="302" x2="720" y2="302" class="line"/>

  <!-- Aurora waves bottom -->
  <path d="M0 305 Q100 295 200 308 Q300 318 400 305 Q500 292 600 308 Q680 318 760 305 L760 320 L0 320 Z" class="aurora1"/>
  <path d="M0 310 Q150 300 300 312 Q450 322 600 310 Q700 302 760 312 L760 320 L0 320 Z" class="aurora2"/>
</svg>
