<text x="42" y="100" fill="#F4FAFF" font-family="Arial" font-size="27" font-weight="700">Experiência de negócio. Mentalidade de tecnologia.</text>
<text x="42" y="137" fill="#9CB2C8" font-family="Arial" font-size="16">Profissional com cerca de 10 anos no mercado financeiro e meios de pagamento,</text>
