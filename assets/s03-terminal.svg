<svg width="100%" viewBox="0 0 760 310" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .bg { fill: #040d1a; }
    .term-bg { fill: #071220; }
    .aurora1 { fill: #0a4a3a; opacity: 0.4; }
    .aurora2 { fill: #0d6e52; opacity: 0.25; }
    .star { fill: #c8eeff; }
    .title { font-family: 'Courier New', monospace; font-size: 16px; font-weight: 700; fill: #7df9ff; letter-spacing: 3px; }
    .ok { font-family: 'Courier New', monospace; font-size: 10px; fill: #5ecfa0; }
    .cmd { font-family: 'Courier New', monospace; font-size: 10px; fill: #7df9ff; }
    .info-key { font-family: 'Courier New', monospace; font-size: 10px; fill: #5ecfa0; }
    .info-val { font-family: 'Courier New', monospace; font-size: 10px; fill: #e8f9ff; }
    .line { stroke: #7df9ff; stroke-width: 0.4; opacity: 0.4; }
    .term-border { stroke: #0d6e52; stroke-width: 0.8; fill: none; }
    .sep { stroke: #3fbf88; stroke-width: 0.5; opacity: 0.5; }
  </style>
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="760" height="310" class="bg"/>

  <!-- Aurora waves top -->
  <path d="M0 0 Q100 22 200 10 Q300 0 400 16 Q500 30 600 12 Q680 2 760 14 L760 45 L0 45 Z" class="aurora1"/>
  <path d="M0 0 Q120 16 240 7 Q360 0 480 14 Q600 26 760 9 L760 35 L0 35 Z" class="aurora2"/>

  <!-- Stars -->
  <circle cx="80" cy="12" r="0.7" class="star" opacity="0.8"/>
  <circle cx="250" cy="6" r="0.6" class="star" opacity="0.7"/>
  <circle cx="450" cy="10" r="0.8" class="star" opacity="0.85"/>
  <circle cx="640" cy="7" r="0.6" class="star" opacity="0.7"/>

  <line x1="40" y1="44" x2="720" y2="44" class="line"/>

  <!-- Title -->
  <text x="380" y="68" text-anchor="middle" class="title" filter="url(#glow)">03 // FOX_TERMINAL</text>

  <!-- Terminal box -->
  <rect x="60" y="80" width="640" height="196" rx="6" class="term-bg"/>
  <rect x="60" y="80" width="640" height="196" rx="6" class="term-border"/>

  <!-- Terminal header bar -->
  <rect x="60" y="80" width="640" height="22" rx="6" fill="#0a1e30"/>
  <circle cx="82" cy="91" r="4" fill="#ff5f57" opacity="0.8"/>
  <circle cx="98" cy="91" r="4" fill="#febc2e" opacity="0.8"/>
  <circle cx="114" cy="91" r="4" fill="#28c840" opacity="0.8"/>
  <text x="380" y="95" text-anchor="middle" font-family="Courier New" font-size="9" fill="#5ecfa0" letter-spacing="2">AURORA SYSTEM v1.0</text>

  <!-- Terminal content -->
  <text x="80" y="120" class="cmd">&gt; Inicializando perfil de desenvolvedor...</text>
  <text x="80" y="136" class="ok">[ OK ] Experiência profissional carregada</text>
  <text x="80" y="150" class="ok">[ OK ] Módulos de automação carregados</text>
  <text x="80" y="164" class="ok">[ OK ] Módulos de desenvolvimento carregados</text>
  <text x="80" y="178" class="ok">[ OK ] Núcleo de IA carregado</text>
  <text x="80" y="192" class="ok">[ OK ] Sistema antifraude em desenvolvimento</text>

  <line x1="80" y1="200" x2="680" y2="200" class="sep"/>

  <text x="80" y="216" class="info-key">FUNÇÃO     <tspan class="info-val">: BackOffice | Chargeback | Fraud Prevention</tspan></text>
  <text x="80" y="230" class="info-key">LINGUAGENS <tspan class="info-val">: Python | Java | SQL</tspan></text>
  <text x="80" y="244" class="info-key">PROJETO    <tspan class="info-val">: FraudShield</tspan></text>
  <text x="80" y="258" class="info-key">STATUS     <tspan fill="#5ecfa0">: ONLINE ▮</tspan></text>

  <!-- Bottom -->
  <line x1="40" y1="290" x2="720" y2="290" class="line"/>
  <path d="M0 293 Q150 283 300 296 Q450 306 600 293 Q700 284 760 294 L760 310 L0 310 Z" class="aurora1"/>
  <path d="M0 300 Q180 290 360 302 Q540 312 760 298 L760 310 L0 310 Z" class="aurora2"/>
</svg>
